name: Smart Retail Build Pipeline

on:

 push:

   branches:

     - main

jobs:

 build:

   runs-on: ubuntu-latest

   steps:

   - name: Checkout Code

     uses: actions/checkout@v4

   - name: Install Node

     uses: actions/setup-node@v4

     with:

       node-version: 20

   - name: Install Dependencies

     run: |

       cd services/catalog-service

       npm install

   - name: Run Tests

     run: |

       cd services/catalog-service

       npm test

   - name: Build Docker Image

     run: |

       cd services/catalog-service

       docker build -t catalog-service:${{ github.run_number }} .
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and Push Docker Image
      run: |
        cd services/catalog-service
        # Define image tags using your Docker Hub username
        IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/catalog-service"
        VERSION_TAG="${{ github.run_number }}"
